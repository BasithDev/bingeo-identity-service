apiVersion: apps/v1
kind: Deployment
metadata:
  name: identity-service
  namespace: bingeo-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: identity-service
  template:
    metadata:
      labels:
        app: identity-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3001"
    spec:
      containers:
        - name: identity
          image: bingeo/identity-service
          ports:
            - containerPort: 3001
          env:
            - name: NODE_ENV
              value: "development"
            - name: PORT
              value: "3001"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector.bingeo-obs:4317"
            - name: OTEL_SERVICE_NAME
              value: "identity-service"
            - name: LOKI_URL
              value: "http://loki.bingeo-obs:3100"
          livenessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            limits:
              memory: "256Mi"
              cpu: "200m"
            requests:
              memory: "128Mi"
              cpu: "100m"
