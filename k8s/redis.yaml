# Redis for identity service (co-located with the service, not global)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: identity-redis
  namespace: bingeo-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: identity-service
      type: cache
  template:
    metadata:
      labels:
        app: identity-service
        type: cache
    spec:
      containers:
        - name: identity-redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          command: ["redis-server", "--save", "", "--appendonly", "no"]
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "100m"
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: identity-redis
  namespace: bingeo-app
spec:
  type: ClusterIP
  selector:
    app: identity-service
    type: cache
  ports:
    - port: 6379
      targetPort: 6379
